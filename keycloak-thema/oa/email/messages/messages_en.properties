passwordResetSubject=Office Assistent: reset your password or authenticator
passwordResetBody=Someone asked to reset the password or authenticator app of your Office Assistent account.\n\nWas this you? Open this link:\n\n{0}\n\nYou first link your authenticator app again (you will see the QR code) and then choose a new password. Afterwards, remove an old app in your account: Account security → Signing in.\n\nThe link works for {3}.\n\nWasn''t this you? Ignore this email; nothing will change. If you keep receiving it without asking, tell your administrator.
passwordResetBodyHtml=<p>Someone asked to reset the password or authenticator app of your Office Assistent account.</p><p>Was this you? Open this link:</p><p><a href="{0}">Reset password or authenticator</a></p><p>You first link your authenticator app again (you will see the QR code) and then choose a new password. Afterwards, remove an old app in your account: Account security → Signing in.</p><p>The link works for {3}.</p><p>Wasn''t this you? Ignore this email; nothing will change. If you keep receiving it without asking, tell your administrator.</p>
# Email the administrator has sent (admin portal, Staff page): set up a new account, or reset password or authenticator.
executeActionsSubject=Office Assistant: set up your account
executeActionsBody=An administrator of your municipality asks you to set up your Office Assistant account: {3}.\n\nOpen this link:\n\n{0}\n\nYou need an authenticator app on your phone (for example Microsoft Authenticator, Google Authenticator or FreeOTP) to scan the QR code.\n\nThe link works for {4}. After that, ask the administrator for a new one.\n\nNot expecting this email? Then ignore it; nothing changes.
executeActionsBodyHtml=<p>An administrator of your municipality asks you to set up your Office Assistant account: {3}.</p><p><a href="{0}">Set up my account</a></p><p>You need an authenticator app on your phone (for example Microsoft Authenticator, Google Authenticator or FreeOTP) to scan the QR code.</p><p>The link works for {4}. After that, ask the administrator for a new one.</p><p>Not expecting this email? Then ignore it; nothing changes.</p>
requiredAction.UPDATE_PASSWORD=choose a password
requiredAction.CONFIGURE_TOTP=link your authenticator app

passwordResetSubject=Office Assistent: wachtwoord of authenticator opnieuw instellen
passwordResetBody=Er is gevraagd om het wachtwoord of de authenticator-app van je account bij de Office Assistent opnieuw in te stellen.\n\nWas jij dat? Open dan deze link:\n\n{0}\n\nJe koppelt eerst je authenticator-app opnieuw (je ziet de QR-code) en kiest daarna een nieuw wachtwoord. Een oude app verwijder je daarna in je account: Accountbeveiliging → Inloggen.\n\nDe link werkt {3}.\n\nWas jij het niet? Negeer dan deze e-mail; er verandert niets. Krijg je deze e-mail vaker zonder dat je erom vroeg, meld het dan bij de beheerder.
passwordResetBodyHtml=<p>Er is gevraagd om het wachtwoord of de authenticator-app van je account bij de Office Assistent opnieuw in te stellen.</p><p>Was jij dat? Open dan deze link:</p><p><a href="{0}">Wachtwoord of authenticator opnieuw instellen</a></p><p>Je koppelt eerst je authenticator-app opnieuw (je ziet de QR-code) en kiest daarna een nieuw wachtwoord. Een oude app verwijder je daarna in je account: Accountbeveiliging → Inloggen.</p><p>De link werkt {3}.</p><p>Was jij het niet? Negeer dan deze e-mail; er verandert niets. Krijg je deze e-mail vaker zonder dat je erom vroeg, meld het dan bij de beheerder.</p>

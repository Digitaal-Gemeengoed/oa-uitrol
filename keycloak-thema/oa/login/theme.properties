# Inlogthema van de Office Assistent: dezelfde Utrecht-componenten en het
# voorbeeldthema van NL Design System als de panelen, compact genoeg voor
# een zijpaneel van ongeveer 380 pixels. Bouwt voort op het basisthema van
# Keycloak: alleen de opmaak (template.ftl) is eigen, de pagina's zelf
# (inloggen, wachtwoord wijzigen, foutmeldingen) komen uit "base".
parent=base
locales=nl,en

styles=css/voorbeeld-theme.css css/utrecht.css css/oa-login.css
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=oa-html
kcBodyClass=voorbeeld-theme utrecht-document oa-login
kcLoginClass=oa-pagina
kcFormCardClass=oa-kaart

## Formulieren
kcFormClass=oa-formulier
kcFormGroupClass=utrecht-form-field oa-veld
kcFormGroupErrorClass=utrecht-form-field--invalid
kcLabelClass=utrecht-form-label
kcLabelWrapperClass=oa-label
kcInputWrapperClass=oa-invoer
kcInputClass=utrecht-textbox utrecht-textbox--html-input
kcTextareaClass=utrecht-textarea utrecht-textarea--html-textarea
kcInputGroup=oa-invoergroep
kcInputErrorMessageClass=utrecht-form-field-error-message oa-fout
kcInputHelperTextBeforeClass=utrecht-form-field-description
kcInputHelperTextAfterClass=utrecht-form-field-description
kcInputClassCheckbox=utrecht-form-field utrecht-form-field--checkbox
kcInputClassCheckboxInput=utrecht-checkbox utrecht-checkbox--html-input
kcInputClassCheckboxLabel=utrecht-form-label utrecht-form-label--checkbox
kcInputClassRadio=utrecht-form-field utrecht-form-field--radio
kcInputClassRadioInput=utrecht-radio-button utrecht-radio-button--html-input
kcInputClassRadioLabel=utrecht-form-label utrecht-form-label--radio
kcCheckboxInputClass=utrecht-checkbox utrecht-checkbox--html-input
kcFormSettingClass=oa-opties
kcFormOptionsClass=oa-opties
kcFormOptionsWrapperClass=oa-opties-rij
kcFormButtonsClass=oa-knoppen
kcFormButtonsWrapperClass=oa-knoppen
kcContentWrapperClass=oa-inhoud
kcMarginTopClass=oa-ruimte-boven
kcSignUpClass=oa-info
kcInfoAreaWrapperClass=oa-info-tekst

## Knoppen
kcButtonClass=utrecht-button
kcButtonPrimaryClass=utrecht-button--primary-action
kcButtonDefaultClass=utrecht-button--secondary-action
kcButtonSecondaryClass=utrecht-button--secondary-action
kcButtonBlockClass=
kcButtonLargeClass=

## Wachtwoord tonen (iconen zitten in oa-login.css)
kcFormPasswordVisibilityButtonClass=oa-oog-knop
kcFormPasswordVisibilityIconShow=oa-oog
kcFormPasswordVisibilityIconHide=oa-oog oa-oog--dicht

## Meldingen
kcAlertClass=utrecht-alert
kcAlertTitleClass=utrecht-alert__message
kcFeedbackErrorIcon=oa-melding-icoon
kcFeedbackWarningIcon=oa-melding-icoon
kcFeedbackSuccessIcon=oa-melding-icoon
kcFeedbackInfoIcon=oa-melding-icoon
kcResetFlowIcon=oa-opnieuw

## Andere manieren van inloggen (bijvoorbeeld Entra ID, later)
kcFormSocialAccountSectionClass=oa-anders
kcFormSocialAccountListClass=oa-anders-lijst
kcFormSocialAccountListGridClass=
kcFormSocialAccountListButtonClass=utrecht-button utrecht-button--secondary-action oa-knop-breed
kcFormSocialAccountListButtonDisabledClass=utrecht-button--disabled
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=
kcSelectAuthListClass=oa-keuzelijst
kcSelectAuthListItemClass=oa-keuzelijst-item
